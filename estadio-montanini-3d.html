<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Estadio Americo Montanini 3D</title>
</head>
<body>
<div id="montanini-3d" class="montanini-3d" aria-label="Modelo 3D interactivo del Estadio Americo Montanini">
  <style>
    body {
      margin: 0;
      background: #111820;
    }

    #montanini-3d {
      --panel-bg: color-mix(in srgb, var(--card, #18232d) 88%, transparent);
      --panel-fg: var(--card-foreground, #f4f7fa);
      --soft-border: color-mix(in srgb, var(--border, #34424e) 70%, transparent);
      min-height: 620px;
      display: grid;
      grid-template-rows: auto minmax(520px, 1fr);
      gap: 12px;
      padding: 16px;
      color: var(--foreground, #f4f7fa);
      background: var(--background, #111820);
      font-family: Arial, Helvetica, sans-serif;
      box-sizing: border-box;
    }

    #montanini-3d .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    #montanini-3d .title {
      display: grid;
      gap: 2px;
    }

    #montanini-3d h2 {
      margin: 0;
    }

    #montanini-3d .actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    #montanini-3d .stage {
      position: relative;
      min-height: 520px;
      overflow: hidden;
      border: 1px solid var(--soft-border);
      border-radius: 8px;
      background:
        radial-gradient(circle at 50% 20%, color-mix(in srgb, var(--blue, #4f9cf9) 12%, transparent), transparent 45%),
        linear-gradient(180deg, color-mix(in srgb, var(--background, #111820) 82%, var(--blue, #4f9cf9)), var(--background, #111820));
    }

    #montanini-3d .btn {
      border: 1px solid var(--soft-border);
      border-radius: 6px;
      padding: 7px 10px;
      color: var(--foreground, #f4f7fa);
      background: color-mix(in srgb, var(--card, #18232d) 92%, transparent);
      font: inherit;
      line-height: 1;
      cursor: pointer;
    }

    #montanini-3d .btn-primary {
      color: var(--primary-foreground, #111820);
      background: var(--primary, #f4f7fa);
      border-color: var(--primary, #f4f7fa);
    }

    #montanini-3d canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #montanini-3d .legend {
      position: absolute;
      left: 12px;
      bottom: 12px;
      max-width: min(520px, calc(100% - 24px));
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      padding: 8px 10px;
      background: var(--panel-bg);
      color: var(--panel-fg);
      border: 1px solid var(--soft-border);
      backdrop-filter: blur(10px);
      font-size: 12px;
    }

    #montanini-3d .key {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    #montanini-3d .swatch {
      width: 12px;
      height: 12px;
      border-radius: 2px;
      background: var(--swatch);
    }

    @media (max-width: 540px) {
      #montanini-3d {
        min-height: 560px;
        grid-template-rows: auto minmax(460px, 1fr);
      }

      #montanini-3d .stage {
        min-height: 460px;
      }

      #montanini-3d .actions {
        width: 100%;
      }

      #montanini-3d .actions .btn {
        flex: 1 1 42%;
      }
    }
  </style>

  <div class="toolbar">
    <div class="title">
      <h2>Estadio Americo Montanini</h2>
      <div class="text-small text-muted">Maqueta 3D inspirada en las referencias: graderias tricolor, cubierta ovalada y tribuna Santander.</div>
    </div>
    <div class="actions" aria-label="Controles de camara">
      <button class="btn btn-primary" type="button" data-view="aerial">Vista aerea</button>
      <button class="btn" type="button" data-view="stand">Tribuna</button>
      <button class="btn" type="button" data-view="field">Cancha</button>
      <button class="btn" type="button" data-toggle="night">Noche</button>
    </div>
  </div>

  <div class="stage">
    <div class="legend" aria-hidden="true">
      <span class="key"><span class="swatch" style="--swatch:#17834a"></span> graderia verde</span>
      <span class="key"><span class="swatch" style="--swatch:#f2d32f"></span> franja amarilla</span>
      <span class="key"><span class="swatch" style="--swatch:#d83b31"></span> franja roja</span>
      <span class="key"><span class="swatch" style="--swatch:#f5f0df"></span> cubierta curva</span>
      <span class="key"><span class="swatch" style="--swatch:#2f3a3f"></span> estructura</span>
    </div>
  </div>

  <script type="module">
    import * as THREE from "https://esm.sh/three@0.160.0";

    const root = document.getElementById("montanini-3d");
    const stage = root.querySelector(".stage");
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xa7d7ff);
    scene.fog = new THREE.Fog(0xa7d7ff, 190, 520);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    stage.prepend(renderer.domElement);

    const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
    camera.position.set(160, 115, 180);

    const currentTarget = new THREE.Vector3(0, 10, 0);
    const minDistance = 85;
    const maxDistance = 360;
    const minPhi = 0.18;
    const maxPhi = Math.PI * 0.48;

    const clock = new THREE.Clock();
    const materials = {
      grass: new THREE.MeshStandardMaterial({ color: 0x2f9a3c, roughness: 0.9 }),
      grassDark: new THREE.MeshStandardMaterial({ color: 0x1f7d35, roughness: 0.95 }),
      track: new THREE.MeshStandardMaterial({ color: 0x35534b, roughness: 0.9 }),
      concrete: new THREE.MeshStandardMaterial({ color: 0xbfc5bf, roughness: 0.9 }),
      stair: new THREE.MeshStandardMaterial({ color: 0xd1d5cf, roughness: 0.85 }),
      red: new THREE.MeshStandardMaterial({ color: 0xd63a2c, roughness: 0.72 }),
      yellow: new THREE.MeshStandardMaterial({ color: 0xf0d62e, roughness: 0.72 }),
      green: new THREE.MeshStandardMaterial({ color: 0x14824a, roughness: 0.72 }),
      mosaicYellow: new THREE.MeshBasicMaterial({ color: 0xf0d62e }),
      seatLetter: new THREE.MeshBasicMaterial({ color: 0x15241e }),
      dark: new THREE.MeshStandardMaterial({ color: 0x26333a, roughness: 0.65, metalness: 0.08 }),
      roof: new THREE.MeshStandardMaterial({ color: 0xf1ead8, roughness: 0.55, metalness: 0.08, side: THREE.DoubleSide }),
      whiteLine: new THREE.MeshBasicMaterial({ color: 0xffffff }),
      glass: new THREE.MeshStandardMaterial({ color: 0x81c4d8, roughness: 0.15, metalness: 0.02, transparent: true, opacity: 0.42 })
    };

    function add(mesh, parent = scene) {
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function ringSegment(inner, outer, start, length, y, colorMat, scaleX = 1.45, scaleZ = 1, thetaSegments = 96) {
      const geometry = new THREE.RingGeometry(inner, outer, thetaSegments, 1, start, length);
      geometry.rotateX(-Math.PI / 2);
      geometry.scale(scaleX, 1, scaleZ);
      const mesh = new THREE.Mesh(geometry, colorMat);
      mesh.position.y = y;
      return add(mesh);
    }

    function box(w, h, d, x, y, z, mat, ry = 0) {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
      mesh.position.set(x, y, z);
      mesh.rotation.y = ry;
      return add(mesh);
    }

    function cylinderBetween(start, end, radius, mat) {
      const direction = new THREE.Vector3().subVectors(end, start);
      const length = direction.length();
      const mesh = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, length, 10), mat);
      mesh.position.copy(start).add(direction.multiplyScalar(0.5));
      mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.normalize());
      return add(mesh);
    }

    function makeTextTexture(text) {
      const canvas = document.createElement("canvas");
      canvas.width = 2048;
      canvas.height = 256;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#f0d62e";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.font = "900 205px Arial, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillStyle = "#20323a";
      ctx.fillText(text, canvas.width / 2, canvas.height / 2 + 10);
      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      return texture;
    }

    const hemi = new THREE.HemisphereLight(0xddeeff, 0x4e683f, 1.6);
    scene.add(hemi);
    const sun = new THREE.DirectionalLight(0xffffff, 2.7);
    sun.position.set(-130, 190, 95);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -220;
    sun.shadow.camera.right = 220;
    sun.shadow.camera.top = 220;
    sun.shadow.camera.bottom = -220;
    scene.add(sun);

    const fieldGroup = new THREE.Group();
    scene.add(fieldGroup);

    const ground = new THREE.Mesh(new THREE.PlaneGeometry(520, 420), materials.grassDark);
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -1.2;
    ground.receiveShadow = true;
    scene.add(ground);

    const field = new THREE.Mesh(new THREE.BoxGeometry(150, 0.5, 92), materials.grass);
    field.position.y = 0;
    field.receiveShadow = true;
    fieldGroup.add(field);

    for (let i = -4; i <= 4; i++) {
      const stripe = new THREE.Mesh(new THREE.BoxGeometry(150, 0.54, 8), i % 2 === 0 ? materials.grass : materials.grassDark);
      stripe.position.set(0, 0.04, i * 10);
      stripe.receiveShadow = true;
      fieldGroup.add(stripe);
    }

    const lineMat = materials.whiteLine;
    const lineY = 0.35;
    function addFieldLine(w, d, x, z) {
      const m = new THREE.Mesh(new THREE.BoxGeometry(w, 0.18, d), lineMat);
      m.position.set(x, lineY, z);
      fieldGroup.add(m);
    }

    // Regulation-style football markings scaled to the 150 x 92 pitch.
    addFieldLine(150, 0.72, 0, -46);
    addFieldLine(150, 0.72, 0, 46);
    addFieldLine(0.72, 92, -75, 0);
    addFieldLine(0.72, 92, 75, 0);
    addFieldLine(0.72, 92, 0, 0);

    [-1, 1].forEach((side) => {
      const penaltyFrontX = side * 53;
      const penaltyMidX = side * 64;
      addFieldLine(0.72, 52, penaltyFrontX, 0);
      addFieldLine(22, 0.72, penaltyMidX, -26);
      addFieldLine(22, 0.72, penaltyMidX, 26);

      const goalAreaFrontX = side * 67;
      const goalAreaMidX = side * 71;
      addFieldLine(0.72, 25, goalAreaFrontX, 0);
      addFieldLine(8, 0.72, goalAreaMidX, -12.5);
      addFieldLine(8, 0.72, goalAreaMidX, 12.5);

      const spot = new THREE.Mesh(new THREE.CylinderGeometry(0.62, 0.62, 0.14, 24), lineMat);
      spot.position.set(side * 59.3, lineY, 0);
      fieldGroup.add(spot);
    });

    const centerCircle = new THREE.Mesh(new THREE.RingGeometry(14, 14.55, 96), lineMat);
    centerCircle.rotation.x = -Math.PI / 2;
    centerCircle.position.y = lineY;
    fieldGroup.add(centerCircle);

    const centerSpot = new THREE.Mesh(new THREE.CylinderGeometry(0.68, 0.68, 0.14, 24), lineMat);
    centerSpot.position.set(0, lineY, 0);
    fieldGroup.add(centerSpot);

    ringSegment(72, 86, 0, Math.PI * 2, 0.1, materials.track, 1.45, 1);
    ringSegment(90, 112, 0, Math.PI * 2, 1.4, materials.concrete, 1.45, 1);

    // The curved bowl uses the same narrow stepped rows as the main stand.
    const bowlRows = 18;
    const bowlSections = 16;
    const sectionAngle = Math.PI * 2 / bowlSections;
    const aisleWidth = 0.035;
    const mainStandStart = Math.PI * 0.27;
    const mainStandEnd = Math.PI * 0.73;

    for (let row = 0; row < bowlRows; row++) {
      const inner = 96 + row * 3.72;
      const outer = inner + 2.65;
      const y = 3.3 + row * 1.48;
      const rowMat = row < 6 ? materials.red : row < 12 ? materials.yellow : materials.green;

      for (let section = 0; section < bowlSections; section++) {
        const sectionStart = section * sectionAngle;
        const seatStart = sectionStart + aisleWidth;
        const seatEnd = sectionStart + sectionAngle - aisleWidth;
        const visibleRanges = [];

        if (seatEnd <= mainStandStart || seatStart >= mainStandEnd) {
          visibleRanges.push([seatStart, seatEnd]);
        } else {
          if (seatStart < mainStandStart) visibleRanges.push([seatStart, mainStandStart]);
          if (seatEnd > mainStandEnd) visibleRanges.push([mainStandEnd, seatEnd]);
        }

        visibleRanges.forEach(([start, end]) => {
          if (end - start < 0.01) return;
          ringSegment(inner, outer, start, end - start, y, rowMat, 1.45, 1, 8);
        });

        const stairAngle = sectionStart - aisleWidth / 2;
        const normalizedStair = (stairAngle + Math.PI * 2) % (Math.PI * 2);
        if (normalizedStair < mainStandStart || normalizedStair > mainStandEnd) {
          ringSegment(inner, outer, stairAngle, aisleWidth, y + 0.08, materials.stair, 1.45, 1, 2);
        }
      }

      ringSegment(inner, outer, mainStandStart - aisleWidth / 2, aisleWidth, y + 0.1, materials.stair, 1.45, 1, 2);
      ringSegment(inner, outer, mainStandEnd - aisleWidth / 2, aisleWidth, y + 0.1, materials.stair, 1.45, 1, 2);
    }

    function buildMainGrandstand() {
      const stand = new THREE.Group();
      stand.name = "Tribuna principal Santander";
      scene.add(stand);

      function standBox(w, h, d, x, y, z, mat) {
        const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
        mesh.position.set(x, y, z);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        stand.add(mesh);
        return mesh;
      }

      // Lower tier: broad, continuous bleachers facing the pitch.
      const lowerRows = 15;
      for (let row = 0; row < lowerRows; row++) {
        const t = row / (lowerRows - 1);
        const z = 89 + t * 35;
        const y = 3.2 + t * 17;
        const width = 214 - t * 10;
        const rowMat = t < 0.34 ? materials.red : t < 0.68 ? materials.yellow : materials.green;
        const sections = [
          [-width * 0.385, width * 0.23],
          [-width * 0.13, width * 0.21],
          [width * 0.13, width * 0.21],
          [width * 0.385, width * 0.23]
        ];
        sections.forEach(([x, sectionWidth]) => standBox(sectionWidth, 0.9, 2.25, x, y, z, rowMat));
      }

      // Concrete stair aisles rise with the lower tier.
      [-56, 0, 56].forEach((x) => {
        for (let step = 0; step < lowerRows; step++) {
          const t = step / (lowerRows - 1);
          standBox(5.2, 0.75, 2.35, x, 3.65 + t * 17, 89 + t * 35, materials.stair);
        }
      });

      // Concourse and press level separating the two tiers.
      standBox(208, 3.2, 10, 0, 23.3, 129, materials.concrete);
      standBox(200, 8, 9, 0, 28.5, 133, materials.dark);
      for (let i = -8; i <= 8; i++) {
        standBox(8.2, 3.2, 0.35, i * 11.1, 28.8, 128.25, materials.glass);
      }

      // Front rows of the upper tier remain red, as in the reference photos.
      const upperRedRows = 5;
      for (let row = 0; row < upperRedRows; row++) {
        const t = row / (upperRedRows - 1);
        const z = 132 + t * 9;
        const y = 34 + t * 6;
        const width = 194 - t * 4;
        const sections = [
          [-width * 0.38, width * 0.235],
          [-width * 0.125, width * 0.235],
          [width * 0.125, width * 0.235],
          [width * 0.38, width * 0.235]
        ];
        sections.forEach(([x, sectionWidth]) => standBox(sectionWidth, 0.95, 2.1, x, y, z, materials.red));
      }

      [-49, 0, 49].forEach((x) => {
        for (let step = 0; step < upperRedRows; step++) {
          const t = step / (upperRedRows - 1);
          standBox(4.5, 0.78, 2.2, x, 34.45 + t * 6, 132 + t * 9, materials.stair);
        }
      });

      // SANTANDER is a seat mosaic: dark seats inside seven rows of yellow seating.
      const glyphs = {
        S: ["11111", "10000", "10000", "11111", "00001", "00001", "11111"],
        A: ["01110", "10001", "10001", "11111", "10001", "10001", "10001"],
        N: ["10001", "11001", "11001", "10101", "10011", "10011", "10001"],
        T: ["11111", "00100", "00100", "00100", "00100", "00100", "00100"],
        D: ["11110", "10001", "10001", "10001", "10001", "10001", "11110"],
        E: ["11111", "10000", "10000", "11110", "10000", "10000", "11111"],
        R: ["11110", "10001", "10001", "11110", "10100", "10010", "10001"]
      };
      const word = "SANTANDER";
      const worldWord = [...word].reverse().join("");
      const glyphWidth = 5;
      const totalColumns = word.length * glyphWidth + word.length - 1;
      const cellWidth = 2.9;
      const startX = -(totalColumns * cellWidth) / 2 + cellWidth / 2;

      for (let tierRow = 0; tierRow < 7; tierRow++) {
        const glyphRow = 6 - tierRow;
        const y = 40.5 + tierRow * 2.5;
        const z = 143.5 + tierRow * 2.55;
        standBox(160, 2.25, 0.55, 0, y - 1.28, z + 1.08, materials.concrete);
        standBox(160, 0.48, 2.35, 0, y - 0.36, z, materials.mosaicYellow);

        let column = 0;
        for (const letter of worldWord) {
          for (let letterColumn = 0; letterColumn < glyphWidth; letterColumn++) {
            const sourceColumn = glyphWidth - 1 - letterColumn;
            const isLetterSeat = glyphs[letter][glyphRow][sourceColumn] === "1";
            const x = startX + column * cellWidth;
            const seatMat = isLetterSeat ? materials.seatLetter : materials.mosaicYellow;
            standBox(cellWidth * 0.94, 0.58, 1.8, x, y, z, seatMat);
            standBox(cellWidth * 0.94, 1.9, 0.42, x, y + 0.87, z + 0.72, seatMat);
            column++;
          }
          column++;
        }
      }

      // Solid rear and side structure keep the upper tier visually grounded.
      standBox(166, 22, 3.5, 0, 49, 161.8, materials.concrete);
      standBox(4, 22, 23, -83, 49, 151, materials.concrete);
      standBox(4, 22, 23, 83, 49, 151, materials.concrete);

      // Visible concrete frame and vomitories make the stand read as a real structure.
      standBox(218, 4, 8, 0, 2, 129, materials.concrete);
      [-104, -70, -35, 0, 35, 70, 104].forEach((x) => {
        standBox(3.2, 25, 5, x, 13.5, 132, materials.concrete);
      });
      [-78, -26, 26, 78].forEach((x) => {
        standBox(15, 4.8, 5.5, x, 20.3, 125, materials.dark);
      });

      return stand;
    }

    const mainGrandstand = buildMainGrandstand();

    function roofSurface() {
      const cols = 32;
      const rows = 8;
      const width = 255;
      const depth = 70;
      const vertices = [];
      const indices = [];
      for (let r = 0; r <= rows; r++) {
        for (let c = 0; c <= cols; c++) {
          const u = c / cols;
          const v = r / rows;
          const x = (u - 0.5) * width;
          const z = 101 + v * depth;
          const arch = Math.sin(u * Math.PI) * 7 + Math.sin(v * Math.PI) * 2;
          const y = 62 + arch + v * 10;
          vertices.push(x, y, z);
        }
      }
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const a = r * (cols + 1) + c;
          const b = a + 1;
          const d = (r + 1) * (cols + 1) + c;
          const e = d + 1;
          indices.push(a, d, b, b, d, e);
        }
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute("position", new THREE.Float32BufferAttribute(vertices, 3));
      geo.setIndex(indices);
      geo.computeVertexNormals();
      return add(new THREE.Mesh(geo, materials.roof));
    }

    const roof = roofSurface();
    roof.receiveShadow = true;

    // Cantilever ribs and rear columns support the main roof without blocking the pitch view.
    for (let i = 0; i <= 8; i++) {
      const x = -120 + i * 30;
      cylinderBetween(new THREE.Vector3(x, 72, 163), new THREE.Vector3(x, 64, 104), 0.72, materials.dark);
      cylinderBetween(new THREE.Vector3(x, 24, 163), new THREE.Vector3(x, 74, 163), 0.85, materials.dark);
      cylinderBetween(new THREE.Vector3(x, 71, 163), new THREE.Vector3(x, 76, 170), 0.62, materials.dark);
    }

    cylinderBetween(new THREE.Vector3(-128, 63, 103), new THREE.Vector3(128, 63, 103), 0.9, materials.dark);

    const ovalRoof = ringSegment(158, 190, Math.PI * 1.02, Math.PI * 0.96, 46, materials.roof, 1.45, 1);
    ovalRoof.rotation.z = 0.015;

    for (let i = 0; i < 10; i++) {
      const a = Math.PI * 1.08 + i * Math.PI * 0.085;
      const base = new THREE.Vector3(Math.cos(a) * 226, 5, Math.sin(a) * 156);
      const top = new THREE.Vector3(Math.cos(a) * 238, 47, Math.sin(a) * 164);
      cylinderBetween(base, top, 0.65, materials.dark);
    }

    function addGoal(side) {
      const postMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
      const frontX = side * 75.8;
      const backX = side * 80;
      box(0.55, 4.2, 0.55, frontX, 2.1, -5, postMat);
      box(0.55, 4.2, 0.55, frontX, 2.1, 5, postMat);
      box(0.55, 0.55, 10.5, frontX, 4.2, 0, postMat);
      box(0.45, 3.3, 0.45, backX, 1.65, -5, postMat);
      box(0.45, 3.3, 0.45, backX, 1.65, 5, postMat);
      cylinderBetween(new THREE.Vector3(frontX, 4.2, -5), new THREE.Vector3(backX, 3.3, -5), 0.22, postMat);
      cylinderBetween(new THREE.Vector3(frontX, 4.2, 5), new THREE.Vector3(backX, 3.3, 5), 0.22, postMat);

      const netMat = new THREE.MeshBasicMaterial({ color: 0xe8f1ef, transparent: true, opacity: 0.28, wireframe: true });
      const net = new THREE.Mesh(new THREE.BoxGeometry(4.1, 3.3, 10), netMat);
      net.position.set((frontX + backX) / 2, 1.7, 0);
      scene.add(net);
    }
    addGoal(-1);
    addGoal(1);

    function addBench(x, z, rot) {
      const canopy = new THREE.Mesh(new THREE.CapsuleGeometry(4, 18, 6, 12), materials.glass);
      canopy.scale.set(1, 0.5, 0.42);
      canopy.position.set(x, 3.6, z);
      canopy.rotation.z = Math.PI / 2;
      canopy.rotation.y = rot;
      add(canopy);
      box(22, 1.2, 2, x, 1.1, z, materials.dark, rot);
    }
    addBench(-28, 64, 0);
    addBench(28, 64, 0);

    function addLightTower(x, z) {
      cylinderBetween(new THREE.Vector3(x, 0, z), new THREE.Vector3(x, 88, z), 1.2, materials.dark);
      cylinderBetween(new THREE.Vector3(x - 8, 58, z), new THREE.Vector3(x + 8, 86, z), 0.45, materials.dark);
      cylinderBetween(new THREE.Vector3(x + 8, 58, z), new THREE.Vector3(x - 8, 86, z), 0.45, materials.dark);
      const head = box(20, 9, 4, x, 92, z, materials.dark);
      for (let i = -3; i <= 3; i++) {
        const lamp = new THREE.Mesh(new THREE.SphereGeometry(1.3, 12, 8), new THREE.MeshBasicMaterial({ color: 0xfff2b0 }));
        lamp.position.set(x + i * 2.6, 92, z - 2.5);
        scene.add(lamp);
      }
      return head;
    }
    addLightTower(-164, -102);
    addLightTower(164, -102);
    addLightTower(-172, 94);
    addLightTower(172, 94);

    const screen = box(30, 18, 3, -92, 43, -104, materials.dark, 0.1);
    const screenFace = new THREE.Mesh(new THREE.PlaneGeometry(26, 14), new THREE.MeshBasicMaterial({ color: 0x111418 }));
    screenFace.position.set(-92, 43, -105.65);
    scene.add(screenFace);

    function addCity() {
      const cityGroup = new THREE.Group();
      scene.add(cityGroup);
      const mats = [
        new THREE.MeshStandardMaterial({ color: 0xc8cac6, roughness: 0.9 }),
        new THREE.MeshStandardMaterial({ color: 0x9fb0b4, roughness: 0.8 }),
        new THREE.MeshStandardMaterial({ color: 0xd8d4c5, roughness: 0.85 })
      ];
      for (let i = 0; i < 58; i++) {
        const angle = Math.PI * (0.03 + Math.random() * 0.94);
        const radius = 245 + Math.random() * 90;
        const x = Math.cos(angle) * radius;
        const z = Math.sin(angle) * radius - 30;
        const h = 12 + Math.random() * 62;
        const w = 8 + Math.random() * 16;
        const d = 8 + Math.random() * 18;
        const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mats[i % mats.length]);
        b.position.set(x, h / 2 - 1, z);
        b.castShadow = true;
        b.receiveShadow = true;
        cityGroup.add(b);
      }
      for (let i = 0; i < 8; i++) {
        const ridge = new THREE.Mesh(new THREE.ConeGeometry(85 + i * 12, 40 + i * 7, 4), new THREE.MeshStandardMaterial({ color: 0x708c72, roughness: 0.95 }));
        ridge.position.set(-260 + i * 80, 13, 270 + (i % 2) * 22);
        ridge.rotation.y = Math.PI / 4;
        ridge.scale.z = 0.55;
        ridge.receiveShadow = true;
        scene.add(ridge);
      }
    }
    addCity();

    const cameraViews = {
      aerial: { position: new THREE.Vector3(210, 220, -235), target: new THREE.Vector3(0, 15, 18) },
      stand: { position: new THREE.Vector3(0, 36, 20), target: new THREE.Vector3(0, 36, 140) },
      field: { position: new THREE.Vector3(-105, 30, 18), target: new THREE.Vector3(22, 13, 0) }
    };
    let desiredPosition = camera.position.clone();
    let desiredTarget = currentTarget.clone();
    let isNight = false;
    let dragStart = null;

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function orbitFromDelta(deltaTheta, deltaPhi, zoom = 1) {
      const offset = desiredPosition.clone().sub(desiredTarget);
      const spherical = new THREE.Spherical().setFromVector3(offset);
      spherical.theta += deltaTheta;
      spherical.phi = clamp(spherical.phi + deltaPhi, minPhi, maxPhi);
      spherical.radius = clamp(spherical.radius * zoom, minDistance, maxDistance);
      desiredPosition.copy(desiredTarget).add(new THREE.Vector3().setFromSpherical(spherical));
    }

    function setView(name) {
      desiredPosition = cameraViews[name].position.clone();
      desiredTarget = cameraViews[name].target.clone();
      root.querySelectorAll("[data-view]").forEach((button) => {
        button.classList.toggle("btn-primary", button.dataset.view === name);
      });
    }

    root.querySelectorAll("[data-view]").forEach((button) => {
      button.addEventListener("click", () => setView(button.dataset.view));
    });

    root.querySelector("[data-toggle='night']").addEventListener("click", (event) => {
      isNight = !isNight;
      event.currentTarget.classList.toggle("btn-primary", isNight);
      scene.background.set(isNight ? 0x111927 : 0xa7d7ff);
      scene.fog.color.set(isNight ? 0x111927 : 0xa7d7ff);
      hemi.intensity = isNight ? 0.45 : 1.6;
      sun.intensity = isNight ? 0.25 : 2.7;
    });

    renderer.domElement.addEventListener("pointerdown", (event) => {
      dragStart = { x: event.clientX, y: event.clientY };
      renderer.domElement.setPointerCapture(event.pointerId);
    });

    renderer.domElement.addEventListener("pointermove", (event) => {
      if (!dragStart) return;
      const dx = event.clientX - dragStart.x;
      const dy = event.clientY - dragStart.y;
      dragStart = { x: event.clientX, y: event.clientY };
      orbitFromDelta(-dx * 0.006, dy * 0.004);
    });

    renderer.domElement.addEventListener("pointerup", () => {
      dragStart = null;
    });

    renderer.domElement.addEventListener("wheel", (event) => {
      event.preventDefault();
      orbitFromDelta(0, 0, event.deltaY > 0 ? 1.08 : 0.92);
    }, { passive: false });

    const resizeObserver = new ResizeObserver(([entry]) => {
      const width = Math.max(320, entry.contentRect.width);
      const height = Math.max(440, entry.contentRect.height);
      renderer.setSize(width, height, false);
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
    });
    resizeObserver.observe(stage);

    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();
      camera.position.lerp(desiredPosition, 0.035);
      currentTarget.lerp(desiredTarget, 0.04);
      camera.lookAt(currentTarget);
      roof.position.y = Math.sin(t * 0.5) * 0.25;
      renderer.render(scene, camera);
    }

    setView("aerial");
    animate();
  </script>
</div>
</body>
</html>
